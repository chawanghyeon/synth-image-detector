[project]
name = "synth-image-detector"
version = "0.4.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.14",
  "numpy==2.2.6",
  "onnxruntime==1.23.2",
  "pillow==12.0.0",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
train = [
  "huggingface-hub==0.36.0",
  "onnx==1.19.1",
  "pyarrow==21.0.0",
  "timm==1.0.30",
  "torch==2.8.0",
]
dev = ["httpx==0.28.1", "onnx==1.19.1", "pre-commit==4.3.0", "pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
detector = "detector.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
